<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Inmuebles | Tu Casa Cartagena</title>
    <link
      rel="shortcut icon"
      href="imagenes/Favicon prueba 1.svg"
      type="image/x-icon"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a href="index.html" class="logo">
          <div class="logo__icon">
            <img
              src="imagenes/Logo Tu Casa Color Fondo transparente.svg"
              alt=""
            />
          </div>
        </a>
        <nav class="nav">
          <a href="index.html" class="nav__link">INICIO</a>
          <a href="catalogo.html" class="nav__link nav__link--active"
            >INMUEBLES</a
          >
          <a
            href="https://wa.me/573104605207?text=Hola%20Tu%20Casa%20Cartagena,%20me%20gustar%C3%ADa%20ser%20atendido(a)%20por%20una%20asesora."
            class="nav__whatsapp"
            target="_blank"
            rel="noopener"
            aria-label="WhatsApp"
          >
            <img src="imagenes/icono whatsapp.svg" alt="WhatsApp" />
          </a>
        </nav>
      </div>
    </header>

    <main class="catalog-page">
      <div class="container">
        <div class="catalog-header">
          <h1>Catálogo de Inmuebles</h1>
          <p>Encuentra la propiedad ideal en Cartagena y sus alrededores</p>
        </div>

        <!-- Search Filters -->
        <div class="filters">
          <div class="filters__row">
            <div class="filters__group">
              <label for="search-input">Buscar</label>
              <input
                type="text"
                id="search-input"
                class="filters__input"
                placeholder="Buscar por nombre, ubicación..."
              />
            </div>
            <div class="filters__group">
              <label for="type-filter">Tipo</label>
              <select id="type-filter" class="filters__select">
                <option value="">Todos</option>
                <option value="casa">Casa</option>
                <option value="apartamento">Apartamento</option>
                <option value="lotes_campestres">Lotes Campestres</option>
              </select>
            </div>
            <div class="filters__group">
              <label for="price-filter">Precio</label>
              <select id="price-filter" class="filters__select">
                <option value="">Todos los precios</option>
                <option value="0-2000000">Hasta $2.000.000</option>
                <option value="2000000-5000000">$2M - $5M</option>
                <option value="5000000-300000000">$5M - $300M</option>
                <option value="300000000-500000000">$300M - $500M</option>
                <option value="500000000-">Más de $500M</option>
              </select>
            </div>
            <div class="filters__group">
              <label for="bedrooms-filter">Habitaciones</label>
              <select id="bedrooms-filter" class="filters__select">
                <option value="">Cualquiera</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4+">4 o más</option>
              </select>
            </div>
          </div>
        </div>

        <p class="results-info" id="results-count"></p>

        <!-- Property cards (same format as featured, generated by JavaScript) -->
        <div class="properties-grid" id="catalog-properties"></div>
      </div>
    </main>

    <script src="js/properties.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/catalogo.js"></script>
  </body>
</html>
